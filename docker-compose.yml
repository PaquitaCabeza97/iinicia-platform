version: '3.9'

services:
  moodle-db:
    image: mariadb:10.11
    container_name: iinicia-moodle-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MOODLE_DB_ROOT_PASSWORD:-iinicia_root_secret}
      MARIADB_USER: ${MOODLE_DB_USER:-bn_moodle}
      MARIADB_PASSWORD: ${MOODLE_DB_PASSWORD:-iinicia_moodle_db_pass}
      MARIADB_DATABASE: ${MOODLE_DB_NAME:-bitnami_moodle}
      MARIADB_CHARACTER_SET: utf8mb4
      MARIADB_COLLATE: utf8mb4_unicode_ci
    volumes:
      - moodle_db_data:/var/lib/mysql
    networks:
      - iinicia-network

  moodle:
    image: bitnami/moodle:4.4
    container_name: iinicia-moodle-lms
    restart: unless-stopped
    depends_on:
      - moodle-db
    ports:
      - "${MOODLE_PORT:-8080}:8080"
      - "${MOODLE_SSL_PORT:-8443}:8443"
    environment:
      MOODLE_DATABASE_TYPE: mariadb
      MOODLE_DATABASE_HOST: moodle-db
      MOODLE_DATABASE_PORT_NUMBER: 3306
      MOODLE_DATABASE_USER: ${MOODLE_DB_USER:-bn_moodle}
      MOODLE_DATABASE_PASSWORD: ${MOODLE_DB_PASSWORD:-iinicia_moodle_db_pass}
      MOODLE_DATABASE_NAME: ${MOODLE_DB_NAME:-bitnami_moodle}
      MOODLE_USERNAME: ${MOODLE_ADMIN_USER:-admin_iinicia}
      MOODLE_PASSWORD: ${MOODLE_ADMIN_PASS:-Iinicia2026!Admin}
      MOODLE_EMAIL: ${MOODLE_ADMIN_EMAIL:-admin@iinicia.edu.mx}
      MOODLE_SITE_NAME: "Campus Virtual IINICIA"
      MOODLE_LANG: es
    volumes:
      - moodle_data:/bitnami/moodle
      - moodledata_data:/bitnami/moodledata
    networks:
      - iinicia-network

volumes:
  moodle_db_data:
  moodle_data:
  moodledata_data:

networks:
  iinicia-network:
    driver: bridge
